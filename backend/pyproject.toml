[project]
name = "agentic-phish-detector"
version = "1.0.0"
description = "Agentic AI phishing email detector powered by LangGraph + NVIDIA Nemotron"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Parsa Farshadfar"}
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
